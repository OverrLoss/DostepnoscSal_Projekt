<body>
  <script>
    // Unregister legacy service workers to force fresh download of Flutter bundles
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    // Sanitize any stale local IP in localStorage if running on HTTPS
    try {
      const urlKey = 'flutter.room_sync_server_url';
      const saved = localStorage.getItem(urlKey);
      if (saved && (saved.indexOf('192.168.') !== -1 || saved.indexOf('localhost') !== -1 || saved.indexOf('127.0.0.1') !== -1 || (location.protocol === 'https:' && saved.startsWith('"http://')))) {
        localStorage.removeItem(urlKey);
      }
    } catch (_) {}
  </script>
  <script src="flutter_bootstrap.js?v=132"></script>
</body>
